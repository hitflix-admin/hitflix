name: Build Daily Puzzle

# Precomputes the day's puzzle for all four daily games (see
# scripts/build-daily-puzzle.mjs) instead of leaving every visitor's browser to
# resolve it live against Wikipedia, then builds and deploys the site directly
# from this same run. The precomputed answer file is never committed — it only
# ever exists in this ephemeral runner and in the deployed Pages artifact — so
# the public repo (and its history) never doubles as an answer key for the
# daily games.
on:
  schedule:
    # Cron is UTC-only and GitHub doesn't shift it for DST, so America/New_York
    # midnight (the games' reset instant — see RESET_TIMEZONE in
    # src/dailyMovie.js) falls at 04:00 UTC during EDT and 05:00 UTC during EST.
    # Two fixed times, ~15 minutes after each, keep this within a reasonable
    # buffer of actual local midnight year-round (plus GitHub's own scheduling
    # jitter, which can run a few to several minutes late). Whichever run lands
    # before real local midnight for the current season is a harmless no-op —
    # the script re-resolves "today" fresh either way since nothing from the
    # earlier run persists across these ephemeral checkouts.
    - cron: "15 4 * * *"
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/build-daily-puzzle.mjs

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
