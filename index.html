<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5QR0GB7DMC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5QR0GB7DMC');
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://hitflix.club/" />

    <!-- Loaded as real <link> tags (not a JS-injected @import) so the browser
         can discover and fetch them from the raw HTML immediately, without
         waiting on the JS bundle to load and render first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />

    <!-- The homepage's default movie previews fetch summaries from this origin
         client-side; preconnecting shaves off the connection setup time. -->
    <link rel="preconnect" href="https://en.wikipedia.org" />

    <title>Hitflix — Rate Movies, Build Lists, Play Daily Games</title>
    <meta
      name="description"
      content="Hitflix is a free hub to rate movies, build ranking lists, play daily movie games, and search for movie information. No account, no ads."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hitflix" />
    <meta property="og:url" content="https://hitflix.club/" />
    <meta property="og:title" content="Hitflix — Rate Movies, Build Lists, Play Daily Games" />
    <meta
      property="og:description"
      content="Hitflix is a free hub to rate movies, build ranking lists, play daily movie games, and search for movie information. No account, no ads."
    />
    <meta property="og:image" content="https://hitflix.club/hitflix-social.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hitflix — Rate Movies, Build Lists, Play Daily Games" />
    <meta
      name="twitter:description"
      content="Hitflix is a free hub to rate movies, build ranking lists, play daily movie games, and search for movie information. No account, no ads."
    />
    <meta name="twitter:image" content="https://hitflix.club/hitflix-social.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Hitflix",
        "url": "https://hitflix.club/",
        "image": "https://hitflix.club/hitflix-social.png",
        "description": "Hitflix is a free hub to rate movies, build ranking lists, play daily movie games, and search for movie information. No account, no ads.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any (web browser)",
        "featureList": [
          "Movie ratings",
          "Movie ranking lists",
          "Daily Movie guessing game",
          "Daily Movie (Oscar Edition) guessing game",
          "Faceoff box office head-to-head game",
          "Faceoff (Oscars Edition) nominations head-to-head game",
          "Movie search and information lookup"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
